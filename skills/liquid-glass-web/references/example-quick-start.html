/* ============================================================
   LIQUID GLASS — canonical material stylesheet (glass.css)
   Source of truth for the liquid-glass-web skill.

   COPY THIS FILE VERBATIM. Customize only the design tokens.
   Every value below was tuned and debugged against real output;
   re-deriving the material from memory loses those fixes.

   Layer model per glass pane (.lg):
     1. ::before — translucent tint, saturation and brightness; no global blur.
     2. ::before (enhanced) — per-pane edge refraction, local reflection blur,
        dispersion and fade. Chromium enhancement; see refraction-snippet.html.
     3. ::after — specular rim, sheen and cursor spotlight.

   Class map:
     .lg            base glass pane
     .lg--thick     large surfaces (cards, modals): heavier shadow
     .lg--thin      small chrome (nav pills, docks): lighter shadow
     .lg-materialize  entrance animation; stagger with --enter-delay
     .lg-chip       NON-glass chip for use inside glass (no glass-on-glass)
     .lg-cta        accent-filled chip variant
     .lg-backdrop   optional colorful blob backdrop (glass needs something
                    to refract; skip if the page has its own imagery)
   ============================================================ */

/* ---------- Design tokens ---------- */
:root {
  color-scheme: light dark;
  /* material */
  --lg-blur: 0px;          /* compatibility token; no whole-pane blur */
  --lg-sat: 1.8;
  --lg-bright: 1.08;
  --lg-radius: 26px;
  /* backdrop hues (blobs / accents) */
  --hue-a: #7c5cff;
  --hue-b: #22d3ee;
  --hue-c: #ff5c8a;
  --hue-d: #ffb86b;
  /* light theme */
  --bg: #eef0f6;
  --ink: #10131c;
  --ink-dim: rgba(16, 19, 28, 0.74);      /* vibrancy: not flat gray */
  --hairline: rgba(16, 19, 28, 0.12);
  --lg-tint: 255 255 255;
  --lg-tint-a: 0.52;
  --lg-border: rgba(255, 255, 255, 0.65);
  --lg-spec: rgba(255, 255, 255, 0.95);
  --lg-shadow: 0 24px 60px rgba(24, 30, 70, 0.20);      /* thick surfaces */
  --lg-shadow-sm: 0 10px 28px rgba(24, 30, 70, 0.12);   /* thin chrome */
  --sheen-a: 0.40;
  --spot-max: 0.25;         /* cursor spotlight peak alpha */
  --chip-bg: rgba(16, 19, 28, 0.055);
  --chip-border: rgba(16, 19, 28, 0.16);
  --accent: #3f3aed;
  --accent-ink: #fff;
  --solid: rgba(255, 255, 255, 0.97);     /* reduced-transparency fill */
  --blob-opacity: 0.55;
}
[data-theme="dark"] {
  --bg: #0a0c15;
  --ink: #f2f4fa;
  --ink-dim: rgba(242, 244, 250, 0.72);
  --hairline: rgba(255, 255, 255, 0.12);
  --lg-tint: 16 18 30;
  --lg-tint-a: 0.44;
  --lg-border: rgba(255, 255, 255, 0.16);
  --lg-spec: rgba(255, 255, 255, 0.45);
  --lg-shadow: 0 24px 60px rgba(0, 0, 0, 0.60);
  --lg-shadow-sm: 0 10px 28px rgba(0, 0, 0, 0.45);
  --sheen-a: 0.16;
  --spot-max: 0.14;
  --chip-bg: rgba(255, 255, 255, 0.07);
  --chip-border: rgba(255, 255, 255, 0.16);
  --accent: #9db4ff;
  --accent-ink: #0a0c15;
  --solid: rgba(15, 17, 28, 0.97);
  --blob-opacity: 0.42;
}
/* system dark preference, unless the user toggled to light */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c15;
    --ink: #f2f4fa;
    --ink-dim: rgba(242, 244, 250, 0.72);
    --hairline: rgba(255, 255, 255, 0.12);
    --lg-tint: 16 18 30;
    --lg-tint-a: 0.44;
    --lg-border: rgba(255, 255, 255, 0.16);
    --lg-spec: rgba(255, 255, 255, 0.45);
    --lg-shadow: 0 24px 60px rgba(0, 0, 0, 0.60);
    --lg-shadow-sm: 0 10px 28px rgba(0, 0, 0, 0.45);
    --sheen-a: 0.16;
    --spot-max: 0.14;
    --chip-bg: rgba(255, 255, 255, 0.07);
    --chip-border: rgba(255, 255, 255, 0.16);
    --accent: #9db4ff;
    --accent-ink: #0a0c15;
    --solid: rgba(15, 17, 28, 0.97);
    --blob-opacity: 0.42;
  }
}

/* ---------- The material ---------- */
/* Cursor spotlight strength — registered so hover can FADE it in and out
   smoothly; browsers without @property simply switch it instantly. */
@property --spot-a {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

.lg {
  position: relative;
  isolation: isolate;               /* contain the pseudo-element stack */
  border-radius: var(--lg-radius);
  border: 1px solid var(--lg-border);
  box-shadow: var(--lg-shadow);
  --spot-a: 0;
}
@media (hover: hover) {
  .lg:hover { --spot-a: var(--spot-max); }
}

/* Layer 1+2: tint (universal); refraction override further down */
.lg::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  /* concentric corners: inner radius = outer radius − 1px border,
     otherwise the fill pulls away from the frame at the corners */
  border-radius: calc(var(--lg-radius) - 1px);
  background: rgb(var(--lg-tint) / var(--lg-tint-a));
  /* values inlined (not var()) — Safari can drop backdrop-filter when the
     value list contains CSS variables */
  -webkit-backdrop-filter: saturate(1.8) brightness(1.08);
  backdrop-filter: saturate(1.8) brightness(1.08);
}

/* Layer 3: specular rim + sheen + cursor spotlight.
   Inset speculars MUST live here: painted on the element itself they sit
   under the material layer (paint order) and disappear. */
.lg::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  border-radius: calc(var(--lg-radius) - 1px); pointer-events: none;
  box-shadow:
    inset 0 1px 1px var(--lg-spec),
    inset 0 -1px 1px rgba(255, 255, 255, 0.22),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  background:
    radial-gradient(420px circle at var(--mx, 50%) var(--my, -40%),
      rgb(255 255 255 / var(--spot-a)) 0%,
      rgb(255 255 255 / calc(var(--spot-a) * 0.55)) 26%,
      rgb(255 255 255 / calc(var(--spot-a) * 0.18)) 55%,
      transparent 80%),
    linear-gradient(125deg,
      rgba(255, 255, 255, var(--sheen-a)),
      rgba(255, 255, 255, 0.04) 32%, transparent 60%);
}

/* Refraction — added by JS only where SVG backdrop filters actually render
   (Chromium; see refraction-snippet.html). Safari/Firefox keep the clear tinted
   layer above untouched. */
html.refract .lg::before {
  -webkit-backdrop-filter: var(--lg-filter, saturate(1)) saturate(var(--lg-sat)) brightness(var(--lg-bright));
  backdrop-filter: var(--lg-filter, saturate(1)) saturate(var(--lg-sat)) brightness(var(--lg-bright));
}

/* Circular radii match the size-aware signed-distance refraction map. */

/* Material weight hierarchy: bigger surfaces read thicker */
.lg--thick { --lg-blur: 0px; }
.lg--thick::before {
  -webkit-backdrop-filter: saturate(1.8) brightness(1.08);
  backdrop-filter: saturate(1.8) brightness(1.08);
}
.lg--thin { --lg-blur: 0px; box-shadow: var(--lg-shadow-sm); }
.lg--thin::before {
  -webkit-backdrop-filter: saturate(1.8) brightness(1.06);
  backdrop-filter: saturate(1.8) brightness(1.06);
}

/* Eased theme changes — no abrupt brightness jumps */
body, .lg-backdrop, .lg, .lg::before {
  transition: background-color 0.3s ease, color 0.3s ease,
              border-color 0.3s ease, box-shadow 0.3s ease,
              --spot-a 0.45s ease;
}

/* Materialize on load: blur + scale + fade arrive together.
   CRITICAL: the animation must END with the filter removed (fill:
   backwards, no lingering `filter: blur(0)`) — ANY filter left on a
   glass element creates a new backdrop root and silently kills the
   backdrop-filter effect. */
@keyframes lg-materialize {
  0%   { opacity: 0; transform: translateY(12px) scale(0.97); filter: blur(16px); }
  60%  { filter: blur(2px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
.lg-materialize {
  animation: lg-materialize 0.65s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  animation-delay: var(--enter-delay, 0s);   /* stagger: .14s, .22s, .30s… */
}

/* ---------- Chips (deliberately NOT glass: no glass-on-glass) ---------- */
.lg-chip {
  display: inline-flex; align-items: center; gap: 0.5em;
  padding: 0.48em 0.95em; border-radius: 999px;
  border: 1px solid var(--chip-border);
  background: var(--chip-bg);
  color: var(--ink);
  font-size: 0.86rem; text-decoration: none; cursor: pointer;
  transition: transform 160ms ease-out, background-color 0.3s ease,
              color 0.3s ease, border-color 0.3s ease;
}
.lg-chip:hover { transform: translateY(-1px); }
.lg-chip:active { transform: translateY(0) scale(0.97); }  /* press on pointer-down */
.lg-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.lg-cta { background: var(--accent); color: var(--accent-ink); border: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

/* ---------- Optional blob backdrop ---------- */
.lg-backdrop {
  position: fixed; inset: 0; z-index: -2;
  overflow: hidden; background: var(--bg);
}
.lg-backdrop span {
  position: absolute; border-radius: 50%;
  filter: blur(80px); opacity: var(--blob-opacity);
  will-change: transform;
}
.lg-backdrop .b1 { width: 52vmax; height: 52vmax; left: -14vmax; top: -16vmax; background: var(--hue-a); animation: lg-drift1 28s ease-in-out infinite alternate; }
.lg-backdrop .b2 { width: 44vmax; height: 44vmax; right: -12vmax; top: -6vmax;  background: var(--hue-b); animation: lg-drift2 32s ease-in-out infinite alternate; }
.lg-backdrop .b3 { width: 46vmax; height: 46vmax; left: 8vmax;  bottom: -20vmax; background: var(--hue-c); animation: lg-drift3 26s ease-in-out infinite alternate; }
.lg-backdrop .b4 { width: 34vmax; height: 34vmax; right: 4vmax; bottom: -10vmax; background: var(--hue-d); animation: lg-drift4 34s ease-in-out infinite alternate; }
@keyframes lg-drift1 { to { transform: translate3d(9vmax, 6vmax, 0) scale(1.12); } }
@keyframes lg-drift2 { to { transform: translate3d(-8vmax, 9vmax, 0) scale(0.92); } }
@keyframes lg-drift3 { to { transform: translate3d(10vmax, -7vmax, 0) scale(1.1); } }
@keyframes lg-drift4 { to { transform: translate3d(-7vmax, -8vmax, 0) scale(1.15); } }

/* ---------- Accessibility opt-outs ---------- */
@media (prefers-reduced-transparency: reduce) {
  .lg::before, html.refract .lg::before,
  .lg--thick::before, .lg--thin::before {
    background: var(--solid);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .lg::after { background: none; }
  .lg-backdrop span { display: none; }
}
/* Reduced motion ≠ no feedback: movement is removed (entrances, drifting
   blobs, hover/press translation), short color fades stay. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .lg-chip, .lg-chip:hover, .lg-chip:active { transform: none; }
  .lg-chip { transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
}
/* prefers-contrast: near-solid surfaces with a defined border */
@media (prefers-contrast: more) {
  .lg { border: 1px solid var(--ink); }
  .lg::before, html.refract .lg::before,
  .lg--thick::before, .lg--thin::before {
    background: var(--solid);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .lg::after { background: none; }
  .lg-chip { border-color: var(--ink); }
}
@media (forced-colors: active) {
  .lg { border: 1px solid CanvasText; }
  .lg::before, html.refract .lg::before,
  .lg--thick::before, .lg--thin::before { background: Canvas; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .lg::after { display: none; }
  .lg-backdrop { display: none; }
}

/* ---------- Print: flatten the material cleanly ---------- */
@media print {
  .lg-backdrop { display: none !important; }
  body { background: #fff; color: #000; }
  .lg-materialize { animation: none !important; }
  .lg { border: 1px solid #ddd; border-radius: 10px; box-shadow: none; }
  .lg::before, html.refract .lg::before,
  .lg--thick::before, .lg--thin::before { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .lg::after { display: none; }
  .lg-chip { border-color: #ccc; background: #fff; color: #000; }
  .lg-cta { background: #fff; color: #000; border: 1px solid #999; }
}

/* Optional appearance popover: opaque, not another glass pane. */
.lg-appearance {
  position: fixed; inset: auto; margin: 0; z-index: 1000;
  box-sizing: border-box; width: 280px; max-width: calc(100vw - 24px);
  padding: 20px; border: 1px solid var(--hairline); border-radius: 18px;
  background: var(--bg); color: var(--ink); box-shadow: var(--lg-shadow-sm);
  font: 14px/1.5 system-ui, sans-serif;
}
.lg-appearance h2 { font: 600 16px/1.4 system-ui, sans-serif; margin: 0 0 16px; }
.lg-appearance .lg-theme-options { display: flex; gap: 8px; margin-bottom: 20px; }
.lg-appearance .lg-chip { flex: 1; justify-content: center; min-height: 40px; }
.lg-appearance [aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lg-appearance label { display: block; font-weight: 600; }
.lg-appearance input { display: block; width: 100%; min-height: 36px; margin: 8px 0 0; accent-color: var(--accent); }
@media print { .lg-appearance, #themeToggle { display: none !important; } }

<script>
(function () {
'use strict';
// Monotonically decreasing displacement, with a C2 join to the unaffected
// interior. The Gaussian shoulder makes sourceDistance' locally negative:
// this widens the reflected-looking fold without adding a duplicate image.
// This is a visual approximation, not Apple's shader or a ray-traced lens.
function sourceDistance(d) {
 if (d >= 112) return d;
 const t=d/112;
 const envelope=1-t*t*t*(10+t*(-15+6*t));
 const shoulder=Math.exp(-Math.pow(t/.22,2));
 return d+112*envelope*(.4+.34*shoulder);
}
// The outer stationary point is the local reflection axis. Locate it from
// the mapping instead of fixing it to the panel border or to text content.
let reflectionAxis=0;
for(let d=.1;d<112;d+=.1) {
 if(sourceDistance(d+.01)<sourceDistance(d-.01)) reflectionAxis=d;
}
function reflectionWeight(d) {
 // Keep the entire symmetric support inside the pane and the optical band.
 const sigma=Math.min(22,reflectionAxis/3,(112-reflectionAxis)/3);
 const delta=(d-reflectionAxis)/sigma;
 if(Math.abs(delta)>=3) return 0;
 const t=Math.abs(delta)/3;
 const window=1-t*t*t*(10+t*(-15+6*t));
 return .85*Math.exp(-.5*delta*delta)*window;
}
// A separate, compact edge treatment; zero before the reflection axis.
function edgeWeight(d) {
 const t=Math.min(1,Math.max(0,d/(10/.35)));
 return 1-t*t*t*(10+t*(-15+6*t));
}
const svgNS = 'http://www.w3.org/2000/svg';

const filter = svgNode('filter',{id:filterId,filterUnits:'userSpaceOnUse',primitiveUnits:'userSpaceOnUse',x:0,y:0,'color-interpolation-filters':'sRGB'});

 svgNode('feDisplacementMap',{in:'SourceGraphic',in2:'map',scale:65.2,xChannelSelector:'R',yChannelSelector:'G',result:'ghostFar'}),

 svgNode('feComposite',{in:'softReflection',in2:'reflectionMask',operator:'in',result:'fadedReflection'}),
 svgNode('feComposite',{in:'bent',in2:'reflectionMask',operator:'out',result:'transmission'}),
 svgNode('feComposite',{in:'fadedReflection',in2:'transmission',operator:'arithmetic',k1:0,k2:1,k3:1,k4:0,result:'axisSoftened'}));

// Channel summation (not screen blending) preserves neutral flat colors.

 const values=new Array(20).fill(0); values[channel*5+channel]=1; values[18]=1;

  svgNode('feColorMatrix',{in:name+'Sample',type:'matrix',values:values.join(' '),result:name}));
}

 svgNode('feComposite',{in:'rg',in2:'blue',operator:'arithmetic',k1:0,k2:1,k3:1,k4:0,result:'dispersion'}),
 svgNode('feGaussianBlur',{in:'dispersion',stdDeviation:'1.6',result:'softDispersion'}),
 svgNode('feGaussianBlur',{in:'bent',stdDeviation:'18',result:'edgeWash'}),
 svgNode('feComposite',{in:'softDispersion',in2:'diffuseReflection',operator:'arithmetic',k1:0,k2:.85,k3:.15,k4:0,result:'edgeFaded'}),
 edgeMaskImage,
 svgNode('feComposite',{in:'edgeFaded',in2:'edgeMask',operator:'in',result:'edgeDetail'}),
 svgNode('feComposite',{in:'axisSoftened',in2:'edgeMask',operator:'out',result:'interior'}),
 svgNode('feComposite',{in:'edgeDetail',in2:'interior',operator:'arithmetic',k1:0,k2:1,k3:1,k4:0,result:'chromaticEdge'}),
 edgeFadeImage,
 svgNode('feComposite',{in:'edgeWash',in2:'edgeFadeMask',operator:'in',result:'washedEdge'}),
 svgNode('feComposite',{in:'chromaticEdge',in2:'edgeFadeMask',operator:'out',result:'remainingEdge'}),
 svgNode('feComposite',{in:'washedEdge',in2:'remainingEdge',operator:'arithmetic',k1:0,k2:1,k3:1,k4:0}));
defs.append(filter);
// All blur radii share the optical band's size adaptation, including edge wash.
const blurRadii=Array.from(filter.querySelectorAll('feGaussianBlur'),el=>[el,Number(el.getAttribute('stdDeviation'))]);
glass.style.setProperty('--lg-filter','url(#'+filterId+')');

function updateMap() {
 const w=glass.clientWidth,h=glass.clientHeight;
 if (!w || !h) return; // Closed dialogs are initialized when they become visible.
 const radius=Math.min(parseFloat(getComputedStyle(glass,'::before').borderTopLeftRadius),w/2,h/2);
 // Each edge owns at most 22% of the shortest dimension. Opposite bands
 // stay separated by an unaffected center; large surfaces retain 39.2px.
 const opticalScale=Math.min(1,.22*Math.min(w,h)/39.2);
 const unit=.35*opticalScale;
 const sheet=false;
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const context=canvas.getContext('2d'); const pixels=context.createImageData(w,h);
 const edgePixels=context.createImageData(w,h);
 const fadePixels=context.createImageData(w,h);
 for(let y=0;y<h;y++) for(let x=0;x<w;x++) {
  const px=x+.5-w/2, py=y+.5-h/2;
  const qx=Math.abs(px)-(w/2-radius), qy=Math.abs(py)-(h/2-radius);
  const ox=Math.max(qx,0),oy=Math.max(qy,0), len=Math.hypot(ox,oy);
  const distance=sheet ? h-y-.5 : -(len+Math.min(Math.max(qx,qy),0)-radius);
  let nx=0,ny=0;
  // A notification sheet has one visible horizontal optical edge.
  // Its offscreen top and viewport sides must not act as a second lens.
  if(sheet) ny=-1;
  else if(len>0) { nx=-Math.sign(px)*ox/len; ny=-Math.sign(py)*oy/len; }
  else if(qx>qy) nx=-Math.sign(px); else ny=-Math.sign(py);
  const d=Math.max(0,distance)/unit;
  const shift=(sourceDistance(d)-d)*unit;
  const index=(y*w+x)*4;
  pixels.data[index]=Math.round(128+nx*shift/displacementScale*254);
  pixels.data[index+1]=Math.round(128+ny*shift/displacementScale*254);
  pixels.data[index+2]=Math.round(255*reflectionWeight(d)); pixels.data[index+3]=255;
  edgePixels.data[index]=255; edgePixels.data[index+1]=255; edgePixels.data[index+2]=255;
  edgePixels.data[index+3]=Math.round(255*edgeWeight(d));
  // The colored fringe develops first; only the last few pixels lose detail.
  fadePixels.data[index]=255; fadePixels.data[index+1]=255; fadePixels.data[index+2]=255;
  fadePixels.data[index+3]=Math.round(255*.95*Math.pow(edgeWeight(d),3));
 }
 context.putImageData(pixels,0,0);
 for (const el of [filter,mapImage,edgeMaskImage,edgeFadeImage]) { el.setAttribute('width',w); el.setAttribute('height',h); }
 mapImage.setAttribute('href',canvas.toDataURL());
 context.putImageData(edgePixels,0,0);
 edgeMaskImage.setAttribute('href',canvas.toDataURL());
 context.putImageData(fadePixels,0,0);
 edgeFadeImage.setAttribute('href',canvas.toDataURL());
 for(const [el,radius] of blurRadii) el.setAttribute('stdDeviation',String(radius*opticalScale));

}

 new ResizeObserver(updateMap).observe(glass);
});
})();
/* Part 3: cursor spotlight (1:1, direct manipulation) */
(function () {
  var fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!fine || still) return;

  document.querySelectorAll(".lg").forEach(function (el) {
    el.addEventListener("pointermove", function (e) {
      var r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
    // No reset on pointerleave: the spotlight fades out in place
    // via the --spot-a hover transition instead of snapping away.
  });
})();



/* Optional appearance menu. Omit #themeToggle to omit the entire component. */
(function () {
 const root=document.documentElement, button=document.getElementById('themeToggle');
 if(!button) return;
 const zh=document.documentElement.lang.startsWith('zh');
 const title=zh?'外观设置':'Appearance', light=zh?'浅色':'Light', dark=zh?'深色':'Dark';
 const label=zh?'玻璃透明度':'Glass transparency';
 button.setAttribute('aria-label',title);
 button.setAttribute('aria-controls','lgAppearance');
 button.setAttribute('aria-expanded','false');
 const panel=document.createElement('section');
 panel.id='lgAppearance'; panel.className='lg-appearance'; panel.setAttribute('popover','auto');
 panel.setAttribute('aria-label',title);
 panel.innerHTML='<h2>'+title+'</h2><div class="lg-theme-options"><button type="button" class="lg-chip" data-lg-theme="light">'+light+'</button><button type="button" class="lg-chip" data-lg-theme="dark">'+dark+'</button></div><label for="lgTransparency">'+label+'</label><input id="lgTransparency" type="range" min="40" max="80" value="48">';
 document.body.append(panel);
 const slider=panel.querySelector('input');
 let customized=false;
 function syncTheme(){
   const theme=root.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
   panel.querySelectorAll('[data-lg-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lgTheme===theme)));
   if(!customized) slider.value=Math.round((1-parseFloat(getComputedStyle(root).getPropertyValue('--lg-tint-a')))*100);
 }
 syncTheme();
 function place(){
   const r=button.getBoundingClientRect();
   panel.style.left=Math.max(12,Math.min(innerWidth-panel.offsetWidth-12,r.right-panel.offsetWidth))+'px';
   panel.style.top=Math.max(12,Math.min(innerHeight-panel.offsetHeight-12,r.bottom+10))+'px';
 }
 button.addEventListener('click',()=>{panel.togglePopover();if(panel.matches(':popover-open'))place();});
 panel.addEventListener('toggle',()=>button.setAttribute('aria-expanded',String(panel.matches(':popover-open'))));
 panel.querySelectorAll('[data-lg-theme]').forEach(b=>b.addEventListener('click',()=>{root.dataset.theme=b.dataset.lgTheme;syncTheme();}));
 slider.addEventListener('input',()=>{customized=true;root.style.setProperty('--lg-tint-a',String(1-Number(slider.value)/100));});
 document.addEventListener('keydown',e=>{if(e.key==='Escape' && panel.matches(':popover-open')){panel.hidePopover();button.focus();e.preventDefault();}});
 panel.addEventListener('focusout',e=>{if(e.relatedTarget && !panel.contains(e.relatedTarget) && e.relatedTarget!==button)panel.hidePopover();});
 window.addEventListener('resize',()=>{if(panel.matches(':popover-open'))place();});
 document.addEventListener('scroll',()=>{if(panel.matches(':popover-open'))place();},true);
 matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncTheme);
})();

</script>
